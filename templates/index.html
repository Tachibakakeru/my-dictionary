<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Master | 隨身字典</title>
    <style>
        :root {
            --primary: #4a90e2; --secondary: #f39c12; --danger: #e74c3c; --success: #2ecc71;
            --bg: #f8f9fa; --text: #2c3e50; --card-bg: white; --nav-bg: white;
            --input-border: #eee; --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --nav-bg: #1e1e1e;
            --input-border: #333; --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; 
            background-color: var(--bg); color: var(--text); line-height: 1.6; transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .navbar {
            background: var(--nav-bg); padding: 0.6rem 1rem; box-shadow: var(--shadow);
            position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-left { display: flex; align-items: center; gap: 8px; flex-shrink: 1; min-width: 0; }
        .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .navbar h1 { 
            margin: 0; 
            font-size: 1.1rem; 
            color: var(--primary); 
            cursor: pointer; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 480px) {
            .navbar { padding: 0.6rem 0.8rem; }
            .navbar h1 { font-size: 1rem; }
            .btn-back { padding: 4px 6px; font-size: 0.8rem; }
            .stat-badge { font-size: 0.75rem !important; }
        }

        .btn-back {
            background: none; border: 1.5px solid var(--primary); color: var(--primary);
            padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
            font-weight: bold; display: none; align-items: center; gap: 5px;
            flex-shrink: 0;
        }

        .stat-badge { font-size: 0.8rem; font-weight: bold; opacity: 0.8; }

        .container { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; padding-bottom: 80px; }
        
        .category-menu { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 600px) { .category-menu { grid-template-columns: repeat(3, 1fr); } }
        
        .category-card {
            background: var(--card-bg); padding: 2rem; border-radius: 15px;
            text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: 0.3s;
        }
        .category-card:active { transform: scale(0.95); }
        .category-card i { font-size: 2.5rem; margin-bottom: 0.8rem; display: block; }
        .category-card h3 { margin: 0.5rem 0; font-size: 1.2rem; }
        .category-card p { margin: 0; font-size: 0.85rem; opacity: 0.6; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .search-container { position: relative; margin-bottom: 1rem; }
        .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        input, select, textarea {
            padding: 12px 15px; border: 2px solid var(--input-border); border-radius: 12px;
            font-size: 1rem; background: var(--card-bg); color: var(--text); width: 100%; box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: var(--primary); }
        .btn-clear {
            position: absolute; right: 12px; width: 26px; height: 26px; background: rgba(0,0,0,0.08);
            border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text); opacity: 0.5;
        }

        .alphabet-nav {
            display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 1rem; justify-content: center;
            position: sticky; top: 55px; z-index: 90; background: var(--bg); padding: 8px 0;
        }
        @media (max-width: 768px) {
            .alphabet-nav { position: static; }
        }
        .letter-link {
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            background: var(--card-bg); border-radius: 6px; text-decoration: none; color: var(--text);
            font-weight: bold; font-size: 0.8rem; box-shadow: var(--shadow);
        }
        .letter-link.active { background: var(--primary); color: white; transform: scale(1.1); }

        .word-list { display: flex; flex-direction: column; gap: 1rem; }
        .word-card {
            background: var(--card-bg); padding: 1.2rem; border-radius: 12px;
            box-shadow: var(--shadow); border-left: 5px solid var(--primary);
            position: relative;
        }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .word-card h4 { margin: 0 0 0.5rem 0; font-size: 1.3rem; color: var(--primary); flex: 1; }
        .card-actions { display: flex; gap: 8px; }
        .btn-icon { 
            background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 5px;
            border-radius: 50%; transition: 0.2s; color: var(--text); opacity: 0.4;
        }
        .btn-icon:hover { opacity: 1; background: rgba(0,0,0,0.05); }
        .btn-icon.delete:hover { color: var(--danger); }

        .definition-row {
            display: flex; gap: 10px; padding: 8px; background: rgba(0,0,0,0.03);
            border-radius: 8px; margin-top: 6px; align-items: baseline;
        }
        [data-theme="dark"] .definition-row { background: rgba(255,255,255,0.05); }
        .pos-badge { 
            color: var(--secondary); font-weight: bold; background: rgba(243, 156, 18, 0.15);
            padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; white-space: nowrap;
        }

        .group-header {
            font-size: 1.5rem; color: var(--primary); font-weight: bold; display: block;
            border-bottom: 2.5px solid var(--primary); margin: 1.5rem 0 0.8rem;
        }

        /* Floating Action Button */
        .fab {
            position: fixed; bottom: 25px; right: 25px; width: 56px; height: 56px;
            background: var(--primary); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 1000;
            font-size: 1.5rem; transition: 0.3s;
        }
        .fab:active { transform: scale(0.9); }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center;
            z-index: 2000; padding: 15px; box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 500px;
            padding: 1.5rem; border-radius: 15px; box-shadow: var(--shadow);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-title { margin: 0 0 1rem 0; font-size: 1.5rem; color: var(--primary); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; }
        .btn {
            padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: rgba(0,0,0,0.1); color: var(--text); }
        [data-theme="dark"] .btn-secondary { background: rgba(255,255,255,0.1); }

        .scroll-top {
            position: fixed; bottom: 95px; right: 25px; width: 45px; height: 45px;
            background: var(--secondary); color: white; border-radius: 50%;
            display: none; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 999;
        }
    </style>
</head>
<body data-theme="light">

<nav class="navbar">
    <div class="nav-left">
        <button class="btn-back" id="btnBack" onclick="showSection('home')">← 返回</button>
        <h1 onclick="showSection('home')">English Master 📖</h1>
    </div>
    <div class="nav-right">
        <span id="statCount" class="stat-badge"></span>
        <button onclick="showSection('settings')" id="btnSettings" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">⚙️</button>
        <button onclick="toggleTheme()" id="themeToggle" style="background:none; border:1px solid var(--primary); color:var(--primary); border-radius:15px; padding:3px 8px; font-size:1rem; cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center;">🌙</button>
    </div>
</nav>

<div class="container">
    <!-- 主選單視圖 -->
    <div id="home-section" class="view-section active">
        <div class="category-menu">
            <div class="category-card" onclick="showSection('vocabulary')"><i>🔤</i><h3>Vocabulary</h3><p>單字查詢</p></div>
            <div class="category-card" onclick="showSection('phrase')"><i>🗣️</i><h3>Phrase</h3><p>常用片語</p></div>
            <div class="category-card" onclick="showSection('slang')"><i>🤪</i><h3>Slang & Idiom & Proverb</h3><p>俚語與諺語</p></div>
        </div>
    </div>

    <!-- Vocabulary 視圖 -->
    <div id="vocabulary-section" class="view-section">
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="searchQuery" placeholder="🔍 搜尋單字或意思..." oninput="updateView('vocab')">
                <button class="btn-clear" onclick="document.getElementById('searchQuery').value=''; updateView('vocab');">✕</button>
            </div>
        </div>
        <div class="alphabet-nav" id="alphabetNav"></div>
        <div id="displayArea" class="word-list"></div>
    </div>

    <!-- Phrase 視圖 -->
    <div id="phrase-section" class="view-section">
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="phraseSearchQuery" placeholder="🔍 搜尋片語..." oninput="updateView('phrase')">
                <button class="btn-clear" onclick="document.getElementById('phraseSearchQuery').value=''; updateView('phrase');">✕</button>
            </div>
        </div>
        <div class="alphabet-nav" id="phraseAlphabetNav"></div>
        <div id="phraseDisplayArea" class="word-list"></div>
    </div>

    <!-- Slang 視圖 -->
    <div id="slang-section" class="view-section">
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="slangSearchQuery" placeholder="🔍 搜尋俚語或諺語..." oninput="updateView('slang')">
                <button class="btn-clear" onclick="document.getElementById('slangSearchQuery').value=''; updateView('slang');">✕</button>
            </div>
        </div>
        <div class="alphabet-nav" id="slangAlphabetNav"></div>
        <div id="slangDisplayArea" class="word-list"></div>
    </div>

    <!-- Settings 視圖 -->
    <div id="settings-section" class="view-section">
        <div class="word-card">
            <h4>系統設定</h4>
            <div class="form-group">
                <label>存取密鑰 (Access Token)</label>
                <input type="password" id="tokenInput" placeholder="輸入編輯用的 Token...">
                <p style="font-size: 0.8rem; opacity: 0.6; margin-top: 5px;">* 若要進行新增/編輯/刪除，請先輸入正確的 Token。</p>
            </div>
            <button class="btn btn-primary" onclick="saveSettings()">儲存設定</button>
        </div>
    </div>
</div>

<!-- Floating Action Button -->
<div class="fab" id="mainFab" onclick="openAddModal()">+</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <h3 class="modal-title" id="modalTitle">新增項目</h3>
        <div id="vocabForm">
            <div class="form-group">
                <label>單字 (Word)</label>
                <input type="text" id="inputWord" onblur="autoFetchExample()">
                <p id="fetchStatus" style="font-size: 0.7rem; color: var(--primary); margin: 2px 0 0 0; display: none;">正在抓取例句...</p>
            </div>
            <div id="definitionsContainer">
                <div class="definition-entry" style="margin-bottom: 10px; padding: 10px; border: 1px dashed var(--primary); border-radius: 8px;">
                    <div class="form-group">
                        <label>詞性 (Type)</label>
                        <input type="text" class="inputType" placeholder="n, v, adj...">
                    </div>
                    <div class="form-group">
                        <label>意思 (Meaning)</label>
                        <textarea class="inputMeaning" rows="2"></textarea>
                    </div>
                </div>
            </div>
            <button class="btn btn-secondary" style="width: 100%; margin-bottom: 10px;" onclick="addDefinitionRow()">+ 增加更多解釋</button>
        </div>
        <div id="commonForm" style="display: none;">
            <div class="form-group">
                <label id="commonLabel">標題</label>
                <input type="text" id="inputCommonTitle">
            </div>
            <div class="form-group">
                <label>意思 (Meaning)</label>
                <textarea id="inputCommonMeaning" rows="3"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveItem()">儲存</button>
        </div>
    </div>
</div>

<div class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</div>

<script>
    let allWords = [];
    let allPhrases = [];
    let allSlangs = [];
    let activeLetter = null;
    let currentCategory = 'home';
    let editingItem = null;

    function initAlphabetNav(navId, category) {
        const nav = document.getElementById(navId);
        if (!nav) return;
        nav.innerHTML = '';
        'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').forEach(char => {
            const a = document.createElement('a');
            a.className = 'letter-link';
            a.innerText = char;
            a.href = 'javascript:void(0)';
            a.onclick = () => {
                activeLetter = (activeLetter === char) ? null : char;
                updateView(category);
            };
            nav.appendChild(a);
        });
    }

    initAlphabetNav('alphabetNav', 'vocab');
    initAlphabetNav('phraseAlphabetNav', 'phrase');
    initAlphabetNav('slangAlphabetNav', 'slang');

    function showSection(id) {
        currentCategory = id;
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.getElementById(id + '-section').classList.add('active');
        document.getElementById('btnBack').style.display = (id === 'home') ? 'none' : 'flex';
        document.getElementById('mainFab').style.display = (['vocabulary', 'phrase', 'slang'].includes(id)) ? 'flex' : 'none';
        
        activeLetter = null;
        if (id === 'home') {
            document.getElementById('statCount').innerText = '';
        } else if (id === 'settings') {
            document.getElementById('tokenInput').value = localStorage.getItem('access_token') || '';
            document.getElementById('statCount').innerText = 'Settings';
        } else {
            updateView(id === 'vocabulary' ? 'vocab' : id);
        }
        window.scrollTo(0,0);
    }

    async function initData() {
        const ts = new Date().getTime();
        try {
            const [vRes, pRes, sRes] = await Promise.all([
                fetch(`/api/words?t=${ts}`),
                fetch(`/api/phrases?t=${ts}`),
                fetch(`/api/slangs?t=${ts}`)
            ]);
            
            if (vRes.ok) allWords = await vRes.json();
            if (pRes.ok) allPhrases = await pRes.json();
            if (sRes.ok) allSlangs = await sRes.json();
            
            if (currentCategory !== 'home' && currentCategory !== 'settings') {
                updateView(currentCategory === 'vocabulary' ? 'vocab' : currentCategory);
            }
        } catch (e) {
            console.error("Fetch error:", e);
        }
    }

    function updateView(category) {
        let query = '';
        let data = [];
        let areaId = '';
        let navId = '';

        if (category === 'vocab' || category === 'vocabulary') {
            query = document.getElementById('searchQuery').value.trim().toLowerCase();
            data = allWords;
            areaId = 'displayArea';
            navId = 'alphabetNav';
        } else if (category === 'phrase') {
            query = document.getElementById('phraseSearchQuery').value.trim().toLowerCase();
            data = allPhrases;
            areaId = 'phraseDisplayArea';
            navId = 'phraseAlphabetNav';
        } else if (category === 'slang') {
            query = document.getElementById('slangSearchQuery').value.trim().toLowerCase();
            data = allSlangs;
            areaId = 'slangDisplayArea';
            navId = 'slangAlphabetNav';
        }

        let filtered = data;

        if (activeLetter) {
            filtered = filtered.filter(item => {
                let text = (item.word || item.phrase || item.slang || '');
                let char = text[0]?.toUpperCase() || '#';
                if (!/[A-Z]/.test(char)) char = '#';
                return char === activeLetter;
            });
        }

        if (query) {
            filtered = filtered.filter(item => {
                if (category === 'vocab' || category === 'vocabulary') {
                    return item.word.toLowerCase().includes(query) || 
                           item.definitions.some(d => d.meaning.toLowerCase().includes(query));
                } else if (category === 'phrase') {
                    return item.phrase.toLowerCase().includes(query) || 
                           item.meaning.toLowerCase().includes(query);
                } else if (category === 'slang') {
                    return item.slang.toLowerCase().includes(query) || 
                           item.meaning.toLowerCase().includes(query);
                }
            });
        }

        render(filtered, category, areaId, navId);
    }

    async function autoFetchExample() {
        const word = document.getElementById('inputWord').value.trim();
        if (!word || currentCategory !== 'vocabulary' || editingItem) return;
        
        const statusEl = document.getElementById('fetchStatus');
        statusEl.style.display = 'block';
        
        try {
            const res = await fetch(`/api/fetch-example?word=${encodeURIComponent(word)}`);
            const data = await res.json();
            if (data.example) {
                const entries = document.querySelectorAll('.definition-entry');
                const lastMeaning = entries[entries.length - 1].querySelector('.inputMeaning');
                if (lastMeaning && !lastMeaning.value.includes(data.example)) {
                    let content = lastMeaning.value ? lastMeaning.value + '\n\n' : '';
                    content += `[Example] ${data.example}`;
                    if (data.translation) {
                        content += `\n[Translation] ${data.translation}`;
                    }
                    lastMeaning.value = content;
                }
            }
        } catch (e) { console.error("Fetch example failed", e); }
        finally { statusEl.style.display = 'none'; }
    }

    function render(items, category, areaId, navId) {
        const area = document.getElementById(areaId);
        area.innerHTML = '';
        if (navId) {
            document.querySelectorAll(`#${navId} .letter-link`).forEach(l => l.classList.toggle('active', l.innerText === activeLetter));
        }
        
        let label = 'Items';
        if (category === 'vocab' || category === 'vocabulary') label = 'Vocab';
        else if (category === 'phrase') label = 'Phrases';
        else if (category === 'slang') label = 'Slangs';
        document.getElementById('statCount').innerText = `${items.length} ${label}`;

        const groups = {};
        items.forEach(item => {
            let text = (item.word || item.phrase || item.slang || '');
            let char = text[0]?.toUpperCase() || '#';
            if (!/[A-Z]/.test(char)) char = '#';
            if (!groups[char]) groups[char] = [];
            groups[char].push(item);
        });

        Object.keys(groups).sort().forEach(char => {
            const section = document.createElement('div');
            section.innerHTML = `<span class="group-header">${char}</span>`;
            const list = document.createElement('div');
            list.className = 'word-list';
            
            groups[char].sort((a, b) => {
                let textA = (a.word || a.phrase || a.slang || '').toLowerCase();
                let textB = (b.word || b.phrase || b.slang || '').toLowerCase();
                return textA.localeCompare(textB);
            }).forEach(item => {
                const card = document.createElement('div');
                card.className = 'word-card';
                
                const header = document.createElement('div');
                header.className = 'word-header';
                const title = document.createElement('h4');
                title.innerText = (item.word || item.phrase || item.slang);
                header.appendChild(title);
                
                const actions = document.createElement('div');
                actions.className = 'card-actions';
                
                const speakBtn = document.createElement('button');
                speakBtn.className = 'btn-icon';
                speakBtn.innerHTML = '🔊';
                speakBtn.title = '發音';
                speakBtn.onclick = (e) => {
                    e.stopPropagation();
                    speak(item.word || item.phrase || item.slang);
                };

                const editBtn = document.createElement('button');
                editBtn.className = 'btn-icon';
                editBtn.innerHTML = '✏️';
                editBtn.onclick = () => openEditModal(item, category);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-icon delete';
                delBtn.innerHTML = '🗑️';
                delBtn.onclick = () => deleteItem(item, category);
                
                actions.appendChild(speakBtn);
                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                header.appendChild(actions);
                card.appendChild(header);

                if (item.definitions) {
                    item.definitions.forEach(d => {
                        const row = document.createElement('div');
                        row.className = 'definition-row';
                        row.style.display = 'block'; // 改為 block 確保分行

                        // 拆分意思、例句、翻譯
                        const raw = d.meaning;
                        const meaningPart = raw.split('[Example]')[0].trim();
                        const exampleAll = raw.includes('[Example]') ? raw.split('[Example]')[1] : "";
                        const examplePart = exampleAll.split('[Translation]')[0].trim();
                        const translationPart = exampleAll.includes('[Translation]') ? exampleAll.split('[Translation]')[1].trim() : "";

                        let html = `
                            <!-- 第一行：詞性 + 中文意思 -->
                            <div style="margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px;">
                                <span class="pos-badge">${d.type}</span>
                                <span style="font-weight: bold; font-size: 1.05rem;">${meaningPart}</span>
                            </div>
                        `;

                        if (examplePart) {
                            html += `
                                <!-- 第二行：英文例句 -->
                                <div style="margin-bottom: 4px; padding-left: 10px; border-left: 3px solid var(--primary); font-style: italic; color: var(--text); opacity: 0.9;">
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <span style="font-size: 0.95rem;">${examplePart}</span>
                                        <button class="btn-icon" style="font-size: 0.85rem; opacity: 0.6;" onclick="speak('${examplePart.replace(/'/g, "\\'")}')">🔊</button>
                                    </div>
                                </div>
                            `;
                        }

                        if (translationPart) {
                            html += `
                                <!-- 第三行：例句翻譯 -->
                                <div style="padding-left: 10px; border-left: 3px solid transparent; font-size: 0.85rem; color: var(--secondary); font-weight: 500;">
                                    <span>${translationPart}</span>
                                </div>
                            `;
                        }

                        row.innerHTML = html;
                        card.appendChild(row);
                    });
                }
 else {
                    const row = document.createElement('div');
                    row.className = 'definition-row';
                    row.innerHTML = `<span>${item.meaning}</span>`;
                    card.appendChild(row);
                }
                list.appendChild(card);
            });
            section.appendChild(list);
            area.appendChild(section);
        });
    }

    // --- Modal Logic ---
    function openAddModal() {
        editingItem = null;
        document.getElementById('modalTitle').innerText = '新增項目';
        resetForm();
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function openEditModal(item, category) {
        editingItem = item;
        document.getElementById('modalTitle').innerText = '編輯項目';
        resetForm();
        
        if (item.word) {
            document.getElementById('vocabForm').style.display = 'block';
            document.getElementById('commonForm').style.display = 'none';
            document.getElementById('inputWord').value = item.word;
            document.getElementById('definitionsContainer').innerHTML = '';
            item.definitions.forEach(d => addDefinitionRow(d.type, d.meaning));
        } else {
            document.getElementById('vocabForm').style.display = 'none';
            document.getElementById('commonForm').style.display = 'block';
            document.getElementById('commonLabel').innerText = item.phrase ? '片語 (Phrase)' : '俚語 (Slang)';
            document.getElementById('inputCommonTitle').value = (item.phrase || item.slang);
            document.getElementById('inputCommonMeaning').value = item.meaning;
        }
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function resetForm() {
        document.getElementById('inputWord').value = '';
        document.getElementById('inputCommonTitle').value = '';
        document.getElementById('inputCommonMeaning').value = '';
        document.getElementById('definitionsContainer').innerHTML = '';
        
        if (currentCategory === 'vocabulary') {
            document.getElementById('vocabForm').style.display = 'block';
            document.getElementById('commonForm').style.display = 'none';
            addDefinitionRow();
        } else {
            document.getElementById('vocabForm').style.display = 'none';
            document.getElementById('commonForm').style.display = 'block';
            document.getElementById('commonLabel').innerText = currentCategory === 'phrase' ? '片語 (Phrase)' : '俚語 (Slang)';
        }
    }

    function addDefinitionRow(type = '', meaning = '') {
        const div = document.createElement('div');
        div.className = 'definition-entry';
        div.style = 'margin-bottom: 10px; padding: 10px; border: 1px dashed var(--primary); border-radius: 8px; position: relative;';
        div.innerHTML = `
            <button class="btn-icon delete" style="position: absolute; right: 5px; top: 5px;" onclick="this.parentElement.remove()">✕</button>
            <div class="form-group">
                <label>詞性 (Type)</label>
                <input type="text" class="inputType" placeholder="n, v, adj..." value="${type}">
            </div>
            <div class="form-group">
                <label>意思 (Meaning)</label>
                <textarea class="inputMeaning" rows="2">${meaning}</textarea>
            </div>
        `;
        document.getElementById('definitionsContainer').appendChild(div);
    }

    async function saveItem() {
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert("請先至設定頁面輸入 Access Token！");
            showSection('settings');
            closeModal();
            return;
        }

        let url = '';
        let method = editingItem ? 'PUT' : 'POST';
        let body = {};

        if (currentCategory === 'vocabulary') {
            url = editingItem ? '/api/words/update' : '/api/words';
            const word = document.getElementById('inputWord').value.trim();
            const defs = [];
            document.querySelectorAll('.definition-entry').forEach(el => {
                const t = el.querySelector('.inputType').value.trim();
                const m = el.querySelector('.inputMeaning').value.trim();
                if (t && m) defs.push({type: t, meaning: m});
            });
            if (!word || defs.length === 0) return alert("請填寫完整單字與解釋");
            
            if (editingItem) {
                body = { old_word: editingItem.word, new_word: word, definitions: defs };
            } else {
                // 原有的 POST 介面只支援單個詞性
                for (let d of defs) {
                    const res = await fetch('/api/words', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Access-Token': token },
                        body: JSON.stringify({ word: word, type: d.type, meaning: d.meaning })
                    });
                    const result = await res.json();
                    if (result.status === "exists") {
                        alert(result.message);
                        return; // 中斷
                    }
                }
                initData();
                closeModal();
                return;
            }
        } else if (currentCategory === 'phrase') {
            url = editingItem ? '/api/phrases/update' : '/api/phrases';
            const title = document.getElementById('inputCommonTitle').value.trim();
            const meaning = document.getElementById('inputCommonMeaning').value.trim();
            if (!title || !meaning) return alert("請填寫完整");
            body = editingItem ? { old_phrase: editingItem.phrase, new_phrase: title, meaning: meaning } : { phrase: title, meaning: meaning };
        } else if (currentCategory === 'slang') {
            url = editingItem ? '/api/slangs/update' : '/api/slangs';
            const title = document.getElementById('inputCommonTitle').value.trim();
            const meaning = document.getElementById('inputCommonMeaning').value.trim();
            if (!title || !meaning) return alert("請填寫完整");
            body = editingItem ? { old_slang: editingItem.slang, new_slang: title, meaning: meaning } : { slang: title, meaning: meaning };
        }

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'X-Access-Token': token },
                body: JSON.stringify(body)
            });
            const result = await res.json();
            if (result.success) {
                initData();
                closeModal();
            } else {
                alert(result.message || result.error || "儲存失敗");
            }
        } catch (e) {
            alert("請求發生錯誤");
        }
    }

    async function deleteItem(item, category) {
        if (!confirm(`確定要刪除 "${item.word || item.phrase || item.slang}" 嗎？`)) return;
        
        const token = localStorage.getItem('access_token');
        let url = '';
        if (category === 'vocab' || category === 'vocabulary') url = `/api/words?word=${encodeURIComponent(item.word)}`;
        else if (category === 'phrase') url = `/api/phrases?phrase=${encodeURIComponent(item.phrase)}`;
        else if (category === 'slang') url = `/api/slangs?slang=${encodeURIComponent(item.slang)}`;

        try {
            const res = await fetch(url, {
                method: 'DELETE',
                headers: { 'X-Access-Token': token }
            });
            if (res.ok) initData();
            else alert("刪除失敗，請檢查 Token");
        } catch (e) {
            alert("刪除時發生錯誤");
        }
    }

    // --- Settings & UI ---
    function saveSettings() {
        const token = document.getElementById('tokenInput').value;
        localStorage.setItem('access_token', token);
        alert("設定已儲存");
        showSection('home');
    }

    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(newTheme);
        localStorage.setItem('user_theme', newTheme);
    }

    function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        const btn = document.getElementById('themeToggle');
        if (btn) btn.innerText = theme === 'light' ? '🌙' : '☀️';
    }

    const savedTheme = localStorage.getItem('user_theme') || 'light';
    applyTheme(savedTheme);

    window.onscroll = () => {
        document.getElementById('scrollTopBtn').style.display = window.scrollY > 300 ? 'flex' : 'none';
    };

    function speak(text) {
        if (!text) return;
        // 先停止之前的發音
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9; // 稍微放慢一點點
        window.speechSynthesis.speak(utterance);
    }

    initData();
</script>
</body>
</html>
