<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Master | 隨身字典</title>
    <style>
        :root {
            --primary: #4a90e2; --secondary: #f39c12; --danger: #e74c3c; --success: #2ecc71;
            --bg: #f8f9fa; --text: #2c3e50; --card-bg: white; --nav-bg: white;
            --input-border: #eee; --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --nav-bg: #1e1e1e;
            --input-border: #333; --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; 
            background-color: var(--bg); color: var(--text); line-height: 1.6; transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .navbar {
            background: var(--nav-bg); padding: 0.6rem 1rem; box-shadow: var(--shadow);
            position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-left { display: flex; align-items: center; gap: 8px; flex-shrink: 1; min-width: 0; }
        .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .navbar h1 { 
            margin: 0; 
            font-size: 1.1rem; 
            color: var(--primary); 
            cursor: pointer; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 480px) {
            .navbar { padding: 0.6rem 0.8rem; }
            .navbar h1 { font-size: 1rem; }
            .btn-back { padding: 4px 6px; font-size: 0.8rem; }
            .stat-badge { font-size: 0.75rem !important; }
        }

        .btn-back {
            background: none; border: 1.5px solid var(--primary); color: var(--primary);
            padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
            font-weight: bold; display: none; align-items: center; gap: 5px;
            flex-shrink: 0;
        }

        .stat-badge { font-size: 0.8rem; font-weight: bold; opacity: 0.8; }

        .container { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }
        
        .category-menu { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 600px) { .category-menu { grid-template-columns: repeat(3, 1fr); } }
        
        .category-card {
            background: var(--card-bg); padding: 2rem; border-radius: 15px;
            text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: 0.3s;
        }
        .category-card:active { transform: scale(0.95); }
        .category-card i { font-size: 2.5rem; margin-bottom: 0.8rem; display: block; }
        .category-card h3 { margin: 0.5rem 0; font-size: 1.2rem; }
        .category-card p { margin: 0; font-size: 0.85rem; opacity: 0.6; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .search-container { position: relative; margin-bottom: 1rem; }
        .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        input {
            padding: 12px 45px 12px 15px; border: 2px solid var(--input-border); border-radius: 12px;
            font-size: 1rem; background: var(--card-bg); color: var(--text); width: 100%; box-sizing: border-box;
        }
        .btn-clear {
            position: absolute; right: 12px; width: 26px; height: 26px; background: rgba(0,0,0,0.08);
            border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text); opacity: 0.5;
        }

        .alphabet-nav {
            display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 1rem; justify-content: center;
            position: sticky; top: 55px; z-index: 90; background: var(--bg); padding: 8px 0;
        }
        @media (max-width: 768px) {
            .alphabet-nav { position: static; }
        }
        .letter-link {
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            background: var(--card-bg); border-radius: 6px; text-decoration: none; color: var(--text);
            font-weight: bold; font-size: 0.8rem; box-shadow: var(--shadow);
        }
        .letter-link.active { background: var(--primary); color: white; transform: scale(1.1); }

        .word-list { display: flex; flex-direction: column; gap: 1rem; }
        .word-card {
            background: var(--card-bg); padding: 1.2rem; border-radius: 12px;
            box-shadow: var(--shadow); border-left: 5px solid var(--primary);
        }
        .word-card h4 { margin: 0 0 0.5rem 0; font-size: 1.3rem; color: var(--primary); }
        .definition-row {
            display: flex; gap: 10px; padding: 8px; background: rgba(0,0,0,0.03);
            border-radius: 8px; margin-top: 6px; align-items: baseline;
        }
        [data-theme="dark"] .definition-row { background: rgba(255,255,255,0.05); }
        .pos-badge { 
            color: var(--secondary); font-weight: bold; background: rgba(243, 156, 18, 0.15);
            padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; white-space: nowrap;
        }

        .group-header {
            font-size: 1.5rem; color: var(--primary); font-weight: bold; display: block;
            border-bottom: 2.5px solid var(--primary); margin: 1.5rem 0 0.8rem;
        }

        .scroll-top {
            position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px;
            background: var(--primary); color: white; border-radius: 50%;
            display: none; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 1000;
        }
    </style>
</head>
<body data-theme="light">

<nav class="navbar">
    <div class="nav-left">
        <button class="btn-back" id="btnBack" onclick="showSection('home')">← 返回</button>
        <h1 onclick="showSection('home')">English Master 📖</h1>
    </div>
    <div class="nav-right">
        <span id="statCount" class="stat-badge"></span>
        <button onclick="toggleTheme()" id="themeToggle" style="background:none; border:1px solid var(--primary); color:var(--primary); border-radius:15px; padding:3px 8px; font-size:1rem; cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center;">🌙</button>
    </div>
</nav>

<div class="container">
    <!-- 主選單視圖 -->
    <div id="home-section" class="view-section active">
        <div class="category-menu">
            <div class="category-card" onclick="showSection('vocabulary')"><i>🔤</i><h3>Vocabulary</h3><p>單字查詢</p></div>
            <div class="category-card" onclick="showSection('phrase')"><i>🗣️</i><h3>Phrase</h3><p>常用片語</p></div>
            <div class="category-card" onclick="showSection('slang')"><i>🤪</i><h3>Slang & Idiom & Proverb</h3><p>俚語與諺語</p></div>
        </div>
    </div>

    <!-- Vocabulary 視圖 -->
    <div id="vocabulary-section" class="view-section">
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="searchQuery" placeholder="🔍 搜尋單字或意思..." oninput="updateView('vocab')">
                <button class="btn-clear" onclick="document.getElementById('searchQuery').value=''; updateView('vocab');">✕</button>
            </div>
        </div>
        <div class="alphabet-nav" id="alphabetNav"></div>
        <div id="displayArea" class="word-list"></div>
    </div>

    <!-- Phrase 視圖 -->
    <div id="phrase-section" class="view-section">
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="phraseSearchQuery" placeholder="🔍 搜尋片語..." oninput="updateView('phrase')">
                <button class="btn-clear" onclick="document.getElementById('phraseSearchQuery').value=''; updateView('phrase');">✕</button>
            </div>
        </div>
        <div class="alphabet-nav" id="phraseAlphabetNav"></div>
        <div id="phraseDisplayArea" class="word-list"></div>
    </div>

    <!-- Slang 視圖 -->
    <div id="slang-section" class="view-section">
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="slangSearchQuery" placeholder="🔍 搜尋俚語或諺語..." oninput="updateView('slang')">
                <button class="btn-clear" onclick="document.getElementById('slangSearchQuery').value=''; updateView('slang');">✕</button>
            </div>
        </div>
        <div class="alphabet-nav" id="slangAlphabetNav"></div>
        <div id="slangDisplayArea" class="word-list"></div>
    </div>
</div>

<div class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</div>

<script>
    let allWords = [];
    let allPhrases = [];
    let allSlangs = [];
    let activeLetter = null;
    let currentCategory = 'vocab';

    function initAlphabetNav(navId, category) {
        const nav = document.getElementById(navId);
        nav.innerHTML = '';
        'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('').forEach(char => {
            const a = document.createElement('a');
            a.className = 'letter-link';
            a.innerText = char;
            a.href = 'javascript:void(0)';
            a.onclick = () => {
                activeLetter = (activeLetter === char) ? null : char;
                updateView(category);
            };
            nav.appendChild(a);
        });
    }

    initAlphabetNav('alphabetNav', 'vocab');
    initAlphabetNav('phraseAlphabetNav', 'phrase');
    initAlphabetNav('slangAlphabetNav', 'slang');

    function showSection(id) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.getElementById(id + '-section').classList.add('active');
        document.getElementById('btnBack').style.display = (id === 'home') ? 'none' : 'flex';
        activeLetter = null;
        
        if (id === 'home') {
            document.getElementById('statCount').innerText = '';
        } else {
            currentCategory = (id === 'vocabulary') ? 'vocab' : id;
            updateView(currentCategory);
        }
        window.scrollTo(0,0);
    }

    async function initData() {
        try {
            const [vRes, pRes, sRes] = await Promise.all([
                fetch('dictionary.json'),
                fetch('phrases.json'),
                fetch('slangs.json')
            ]);
            
            if (vRes.ok) { allWords = await vRes.json(); localStorage.setItem('vocab_cache', JSON.stringify(allWords)); }
            if (pRes.ok) { allPhrases = await pRes.json(); localStorage.setItem('phrase_cache', JSON.stringify(allPhrases)); }
            if (sRes.ok) { allSlangs = await sRes.json(); localStorage.setItem('slang_cache', JSON.stringify(allSlangs)); }
        } catch (e) {
            allWords = JSON.parse(localStorage.getItem('vocab_cache') || '[]');
            allPhrases = JSON.parse(localStorage.getItem('phrase_cache') || '[]');
            allSlangs = JSON.parse(localStorage.getItem('slang_cache') || '[]');
        }
        // 不要自動呼叫 updateView，以免在首頁顯示統計
    }

    function updateView(category) {
        let query = '';
        let data = [];
        let areaId = '';
        let navId = '';

        if (category === 'vocab') {
            query = document.getElementById('searchQuery').value.trim().toLowerCase();
            data = allWords;
            areaId = 'displayArea';
            navId = 'alphabetNav';
        } else if (category === 'phrase') {
            query = document.getElementById('phraseSearchQuery').value.trim().toLowerCase();
            data = allPhrases;
            areaId = 'phraseDisplayArea';
            navId = 'phraseAlphabetNav';
        } else if (category === 'slang') {
            query = document.getElementById('slangSearchQuery').value.trim().toLowerCase();
            data = allSlangs;
            areaId = 'slangDisplayArea';
            navId = 'slangAlphabetNav';
        }

        let filtered = data;

        if (activeLetter) {
            filtered = filtered.filter(item => {
                let text = (category === 'vocab' ? item.word : (category === 'phrase' ? item.phrase : item.slang));
                let char = text[0].toUpperCase();
                if (!/[A-Z]/.test(char)) char = '#';
                return char === activeLetter;
            });
        }

        if (query) {
            filtered = filtered.filter(item => {
                if (category === 'vocab') {
                    return item.word.toLowerCase().includes(query) || 
                           item.definitions.some(d => d.meaning.toLowerCase().includes(query));
                } else if (category === 'phrase') {
                    return item.phrase.toLowerCase().includes(query) || 
                           item.meaning.toLowerCase().includes(query);
                } else if (category === 'slang') {
                    return item.slang.toLowerCase().includes(query) || 
                           item.meaning.toLowerCase().includes(query);
                }
            });
        }

        render(filtered, category, areaId, navId);
    }

    function render(items, category, areaId, navId) {
        const area = document.getElementById(areaId);
        area.innerHTML = '';
        document.querySelectorAll(`#${navId} .letter-link`).forEach(l => l.classList.toggle('active', l.innerText === activeLetter));
        
        let label = 'Items';
        if (category === 'vocab') label = 'Vocab';
        else if (category === 'phrase') label = 'Phrases';
        document.getElementById('statCount').innerText = `${items.length} ${label}`;

        // 分群邏輯 (A-Z Headers)
        const groups = {};
        items.forEach(item => {
            let text = (category === 'vocab' ? item.word : (category === 'phrase' ? item.phrase : item.slang));
            if (!text) return;
            let char = text[0].toUpperCase();
            if (!/[A-Z]/.test(char)) char = '#';
            if (!groups[char]) groups[char] = [];
            groups[char].push(item);
        });

        Object.keys(groups).sort().forEach(char => {
            const section = document.createElement('div');
            section.innerHTML = `<span class="group-header">${char}</span>`;
            const list = document.createElement('div');
            list.className = 'word-list';
            
            groups[char].sort((a, b) => {
                let textA = (category === 'vocab' ? a.word : (category === 'phrase' ? a.phrase : a.slang)).toLowerCase();
                let textB = (category === 'vocab' ? b.word : (category === 'phrase' ? b.phrase : b.slang)).toLowerCase();
                return textA.localeCompare(textB);
            }).forEach(item => {
                const card = document.createElement('div');
                card.className = 'word-card';
                if (category === 'vocab') {
                    let defsHtml = '';
                    item.definitions.forEach(d => {
                        defsHtml += `<div class="definition-row"><span class="pos-badge">${d.type}</span><span>${d.meaning}</span></div>`;
                    });
                    card.innerHTML = `<div class="word-header"><h4>${item.word}</h4></div>${defsHtml}`;
                } else if (category === 'phrase') {
                    card.innerHTML = `<div class="word-header"><h4>${item.phrase}</h4></div><div class="definition-row"><span>${item.meaning}</span></div>`;
                } else if (category === 'slang') {
                    card.innerHTML = `<div class="word-header"><h4>${item.slang}</h4></div><div class="definition-row"><span>${item.meaning}</span></div>`;
                }
                list.appendChild(card);
            });
            section.appendChild(list);
            area.appendChild(section);
        });
    }

    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(newTheme);
        localStorage.setItem('user_theme', newTheme);
    }

    function applyTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        const btn = document.getElementById('themeToggle');
        if (btn) btn.innerText = theme === 'light' ? '🌙' : '☀️';
    }

    const savedTheme = localStorage.getItem('user_theme') || 'light';
    applyTheme(savedTheme);

    window.onscroll = () => {
        document.getElementById('scrollTopBtn').style.display = window.scrollY > 300 ? 'flex' : 'none';
    };

    initData();
</script>
</body>
</html>
